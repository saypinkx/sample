[pytest]
testpaths = components

python_files = test_*.py
python_classes = Test*
python_functions = test_*

minversion = 7.0

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider
    --cov=components
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-fail-under=80

markers =
    unit: модульные тесты (быстрые, изолированные)
    integration: интеграционные тесты (требуют БД)
    slow: медленные тесты
    asyncio: асинхронные тесты

asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning

env =
    VERSION=test-v1.0.0
    REDIS_HOST=localhost
    REDIS_PASSWORD=test-redis
    REDIS_PORT=6379
    REDIS_KEY_STORAGE_DB=2
    REDIS_TRACEBACK_STORAGE_DB=4
    POSTGRES_HOST=localhost
    POSTGRES_USER=test_user
    POSTGRES_PASSWORD=test_pass
    POSTGRES_PORT=5432
    POSTGRES_DB=test_db