[tool.poetry]
name = "sample"
version = "0.1.0"
description = "Python backend service"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
aiofiles = "24.1.0"
aiohttp = "3.12.14"
alembic = "1.16.4"
anthropic = "0.50.0"
asyncpg = "0.30.0"
bcrypt = "4.3.0"
beanie = "1.30.0"
boto3 = "1.35.99"
cohere = "5.15.0"
email-validator = "2.3.0"
fastapi = "0.115.12"
greenlet = "3.2.3"
groq = "0.24.0"
httpx = "0.28.1"
humanize = "4.12.3"
izulu = "0.50.0"
lazy-model = "0.2.0"
logfire-api = "3.14.1"
mistralai = "1.5.1"
motor = "3.6.0"
openai = "1.66.3"
opentelemetry-api = "1.31.0"
passlib = {version = "1.7.4", extras = ["bcrypt"]}
pillow = "11.1.0"
prometheus-client = "0.21.1"
psycopg2 = "2.9.10"
pycron = "3.2.0"
pydantic = {version = "2.10.1", extras = ["email"]}
pydantic-ai = "0.0.40"
PyJWT = "2.9.0"
pymongo = "4.9.2"
python-dateutil = "2.9.0.post0"
python-dotenv = "1.2.1"
python-jose = {version = "3.3.0", extras = ["cryptography"]}
python-json-logger = "4.0.0"
python-multipart = "0.0.20"
redis = "5.3.0"
requests = "2.32.3"
rich = "13.9.4"
sqlalchemy = {version = "2.0.41", extras = ["asyncio"]}
stripe = "11.0.0"
tqdm = "4.67.1"
typer = "0.16.0"
uvicorn = {version = "0.34.0", extras = ["standard"]}
watchfiles = "1.1.0"

[tool.poetry.group.dev.dependencies]
black = "25.1.0"
coverage = "7.13.4"
faker = "40.4.0"
pre-commit = "4.5.1"
pytest = "9.0.2"
pytest-asyncio = "1.3.0"
pytest-cov = "7.0.0"
pytest-env = "1.3.2"
pytest-mock = "3.15.1"
ruff = "0.15.1"
types-requests = "2.32.0.20250306"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
strict_optional = false
allow_untyped_globals = true

[tool.yamllint]
extends = "default"
line-length = { max = 88 }

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F821", "F401"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
