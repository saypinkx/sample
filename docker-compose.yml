version: '3.8'

services:
  postgresql:
    image: postgres:15
    container_name: postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 5432:5432
    volumes:
      - ./databases/postgresql:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:6
    container_name: redis
    command: redis-src --requirepass ${REDIS_PASSWORD}
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    env_file:
      - .env

  server:
    build: .
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    container_name: api
    ports:
      - 1516:1516
    volumes:
      - .${BASE_LOG_DIR}:${BASE_LOG_DIR}
    env_file:
      - .env
    environment:
      - PYTHONPATH=/sample/src
    command: sh -c "alembic -c src/alembic.ini upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 1516"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:1516/api/healthcheck || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

